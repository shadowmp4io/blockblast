<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Block Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3f559c;--bg2:#2d3d7c;--cell:#232b5a;--cellb:#1b2250;--rim:#4a60b0;--gold:#f5a623;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#34468a;--bg2:#252f66;--cell:#1d2450;--cellb:#161c42}}
:root[data-theme="dark"]{--bg1:#34468a;--bg2:#252f66;--cell:#1d2450;--cellb:#161c42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:linear-gradient(var(--bg1),var(--bg2));color:#fff;font-family:'Fredoka',system-ui,sans-serif;font-weight:700}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;--bs:min(94vw,560px,calc((100dvh - 200px)/1.43));--cs:calc(var(--bs)/8)}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
#best{display:flex;align-items:center;gap:8px;font-size:30px;color:var(--gold)}
#gear{position:relative;width:46px;height:46px;border:0;background:none;padding:0;cursor:pointer;transition:transform .3s}
#gear:active{transform:rotate(60deg) scale(.9)}
#gear svg{width:100%;height:100%}
#badge{position:absolute;top:-4px;right:-8px;width:26px;height:20px;border-radius:5px;background:#e0202c;display:grid;place-items:center;font-size:12px;transition:background .2s}
#badge.off{background:#6b7399}
#score{font-size:clamp(48px,9dvh,76px);line-height:1;height:clamp(60px,11dvh,90px);display:grid;place-items:center;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#score.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#bw{position:relative;width:var(--bs);height:var(--bs)}
#bw.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#board{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);background:var(--cellb);border-radius:12px;box-shadow:0 0 0 4px var(--rim),0 12px 30px rgba(0,0,0,.3)}
.c{position:relative}
.c::before{content:"";position:absolute;inset:1.5px;border-radius:5px;background:var(--cell)}
.c.f::before,.k,.d{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));box-shadow:inset calc(var(--cs)*.08) calc(var(--cs)*.08) 0 rgba(255,255,255,.28),inset calc(var(--cs)*-.08) calc(var(--cs)*-.08) 0 rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.25)}
.c.f::before{inset:0;border-radius:0}
.c.pop::before{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(1.25);filter:brightness(1.8)}}
.c.gh::before{background:var(--c);opacity:.5;inset:0;border-radius:3px}
.c.gh.h2::before{opacity:.95;filter:brightness(1.2)}
.c.hl::before{filter:brightness(1.4) saturate(1.2);animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.75)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.d{position:absolute;width:12.5%;height:12.5%;animation:dis .42s ease-in both}
@keyframes dis{0%{transform:scale(1)}35%{transform:scale(1.14);filter:brightness(2.4)}100%{transform:scale(0) rotate(50deg);opacity:0}}
.bm{position:absolute;background:var(--c);filter:blur(7px);mix-blend-mode:screen;opacity:0}
.bm.r{left:-4%;width:108%;height:12.5%;animation:bmr .6s ease-out}
.bm.l{top:-4%;height:108%;width:12.5%;animation:bml .6s ease-out}
@keyframes bmr{30%{opacity:.9;transform:scaleY(1.5)}100%{opacity:0;transform:scaleY(.2)}}
@keyframes bml{30%{opacity:.9;transform:scaleX(1.5)}100%{opacity:0;transform:scaleX(.2)}}
#msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0}
#msg.show{animation:msg 1.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes msg{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1)}}
#msg .w{display:block;font-size:calc(var(--bs)*.12);color:#5fb4ff;-webkit-text-stroke:calc(var(--bs)*.012) #fff;paint-order:stroke fill;text-shadow:0 4px 18px rgba(80,160,255,.8)}
#msg .pt{display:block;font-size:calc(var(--bs)*.1);text-shadow:0 3px 12px rgba(0,0,0,.5)}
#msg i{font-style:normal;font-size:calc(var(--bs)*.05);color:var(--gold)}
#tray{display:grid;grid-template-columns:repeat(3,1fr);width:var(--bs);height:calc(var(--cs)*3.4);margin-top:12px}
.slot{position:relative;touch-action:none}
.p{position:absolute;left:50%;top:50%;transition:scale .15s cubic-bezier(.3,1.5,.5,1),opacity .25s,filter .25s;animation:in .45s cubic-bezier(.3,1.4,.5,1) backwards;cursor:grab}
.p.lift{transition:scale .15s cubic-bezier(.3,1.5,.5,1),translate .12s ease-out}
.p.back{transition:scale .25s,translate .28s cubic-bezier(.3,1.4,.5,1);z-index:5}
.p.drag{z-index:5;cursor:grabbing;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.p.dim{opacity:.35;filter:grayscale(.7)}
@keyframes in{from{scale:0;opacity:0;translate:0 50px}}
.k{position:absolute;width:var(--cs);height:var(--cs)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(10,14,40,.62);backdrop-filter:blur(4px)}
.ov.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.pn{width:min(86vw,360px);padding:26px 22px;border-radius:24px;background:linear-gradient(#4a62c4,#3a4fa8);box-shadow:0 0 0 4px #5b72d0,0 20px 50px rgba(0,0,0,.5);text-align:center;animation:pn .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pn{from{transform:scale(.7);opacity:0}}
.pn h2{margin:0 0 6px;font-size:30px}
.pn .big{font-size:64px;line-height:1.1;margin:4px 0}
.pn .sub{color:var(--gold);font-size:20px;min-height:26px}
.bt{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;font:inherit;font-size:22px;color:#fff;cursor:pointer;background:linear-gradient(#45d02a,#2fb01a);box-shadow:0 5px 0 #1d7d10;transition:transform .08s,box-shadow .08s}
.bt:active{transform:translateY(4px);box-shadow:0 1px 0 #1d7d10}
.bt.g{background:linear-gradient(#6a82d8,#5169c4);box-shadow:0 5px 0 #34479a}
.bt.g:active{box-shadow:0 1px 0 #34479a}
.bt.off{filter:grayscale(1) brightness(.8)}
.dead .c.f::before{filter:grayscale(.85) brightness(.65);transition:filter .7s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(circle at 50% 60%,#ff7a1a66,#b02a8a55 50%,transparent 80%)}
body.fire::before{opacity:1;animation:fi 1.4s ease-in-out infinite alternate}
@keyframes fi{to{opacity:.55}}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 50% 45%,var(--fc,#fff),transparent 65%)}
#flash.on{animation:fl .6s ease-out}
@keyframes fl{15%{opacity:.8}100%{opacity:0}}
.rg{position:absolute;width:40%;height:40%;border-radius:50%;border:4px solid var(--c);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:rg .75s ease-out forwards}
@keyframes rg{to{transform:translate(-50%,-50%) scale(3.4);opacity:0;border-width:1px}}
#bw.zoom{animation:zm .4s}
@keyframes zm{40%{transform:scale(1.035)}}
.c.wv::before{animation:wv .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:var(--dl)}
@keyframes wv{from{transform:scale(0);opacity:0}}
#best.rec svg{animation:cr .9s}
@keyframes cr{30%{transform:scale(1.5) rotate(-15deg)}60%{transform:scale(1.2) rotate(10deg)}}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#amb .fb{opacity:.07}
.fb,.tl{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));box-shadow:inset 3px 3px 0 rgba(255,255,255,.28),inset -3px -3px 0 rgba(0,0,0,.28)}
.fb{position:absolute;top:-80px;width:var(--s);height:var(--s);border-radius:3px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115dvh) rotate(200deg)}}
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;background:radial-gradient(circle at 50% 40%,#4b63c0,#1c2552 72%);transition:opacity .6s,transform .7s cubic-bezier(.6,0,.2,1)}
#intro.out{opacity:0;transform:scale(1.3);pointer-events:none}
#ib{position:absolute;inset:0;overflow:hidden}
.lg{--t:min(15vw,68px);display:grid;gap:calc(var(--t)*.14);position:relative}
.row{display:flex;justify-content:center;gap:calc(var(--t)*.12)}
.tl{width:var(--t);height:var(--t);display:grid;place-items:center;font-size:calc(var(--t)*.7);border-radius:calc(var(--t)*.14);text-shadow:0 2px 0 rgba(0,0,0,.35);animation:drop .75s cubic-bezier(.3,1.5,.5,1) var(--d) backwards,wave .5s ease calc(1.8s + var(--i)*.06s)}
@keyframes drop{from{transform:translateY(-110dvh) rotate(-30deg);opacity:0}}
@keyframes wave{40%{transform:translateY(-14px) scale(1.12)}}
.bar{width:min(60vw,260px);height:8px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
.bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,#f5a623,#ffd25a);animation:ld 3.4s cubic-bezier(.5,0,.3,1) both}
@keyframes ld{from{transform:scaleX(0)}}
#tg,#ir{position:relative;margin:0;opacity:0;animation:fd .6s 1.5s forwards;font-size:clamp(16px,4.4vw,22px);color:#cfe0ff}
#ir{color:var(--gold);animation-delay:2s;font-size:18px}
@keyframes fd{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.d,.bm,#msg.show{animation-duration:.01s}}
</style></head>
<body oncontextmenu="return false" oncopy="return false" ondragstart="return false">
<div id="app">
<header>
<div id="best"><svg width="38" height="30" viewBox="0 0 48 36"><path d="M5 31 2 9l13 9 9-14 9 14 13-9-3 22z" fill="#f7c331" stroke="#c98a10" stroke-width="2" stroke-linejoin="round"/><circle cx="2" cy="8" r="3" fill="#f7c331"/><circle cx="24" cy="4" r="3" fill="#f7c331"/><circle cx="46" cy="8" r="3" fill="#f7c331"/></svg><span id="bv">0</span></div>
<button id="gear" aria-label="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.2" fill="none" stroke="#a9d3f5" stroke-width="4.6" stroke-dasharray="3.2 3.2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#a9d3f5" stroke-width="3.4"/></svg><i id="badge">📳</i></button>
</header>
<div id="score">0</div>
<div id="bw"><div id="board"></div><div id="fx"></div><div id="msg"></div></div>
<div id="tray"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
</div>
<canvas id="cv"></canvas>
<div id="flash"></div><div id="amb"></div>
<div id="intro"><div id="ib"></div><div class="lg"><div class="row" id="r1"></div><div class="row" id="r2"></div></div><p id="tg">Place. Aligne. Explose.</p><div class="bar"><i></i></div><p id="ir"></p></div>
<div class="ov" id="menu"><div class="pn"><h2>Réglages</h2>
<button class="bt g" id="tSnd">Son : activé</button>
<button class="bt g" id="tVib">Vibrations : activées</button>
<button class="bt g" id="bNew">Nouvelle partie</button>
<button class="bt" id="bClose">Continuer</button></div></div>
<div class="ov" id="over"><div class="pn"><h2>Partie terminée</h2><div class="big" id="fs">0</div><div class="sub" id="fr"></div><button class="bt" id="bAgain">Rejouer</button></div></div>
<script>
const $=s=>document.querySelector(s),N=8;
const COL=['#f08a2a','#8a4fe0','#d03838','#3b5fe8','#f1c52e','#35b84a','#e8588c','#23b5d3'];
const WORDS=['Bien !','Super !','Excellent !','Incroyable !','Légendaire !'];
// [forme, poids, couleur]
const BASE=[["1",1,3],["11",3,3],["111",3,0],["1111",2,4],["11111",2,1],["11/11",3,4],["111/111/111",1,7],["11/10",3,2],["111/100/100",1,5],["111/010",2,6],["011/110",2,2],["110/011",2,5],["111/100",2,7],["111/001",2,0],["111/111",1,1]];
const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());
const SH=[];
BASE.forEach(([s,wt,c])=>{let m=s.split('/').map(r=>[...r].map(Number)),seen=new Set(),vs=[];
 for(let f=0;f<2;f++){for(let k=0;k<4;k++){const key=JSON.stringify(m);if(!seen.has(key)){seen.add(key);vs.push(m)}m=rot(m)}m=m.map(r=>[...r].reverse())}
 vs.forEach(m=>{const cells=[];m.forEach((r,y)=>r.forEach((v,x)=>v&&cells.push([y,x])));SH.push({cells,h:m.length,w:m[0].length,c,wt:wt/vs.length})})});
SH.forEach((s,i)=>s.id=i);
const TW=SH.reduce((a,s)=>a+s.wt,0);
const pick=()=>{let r=Math.random()*TW;for(const s of SH){if((r-=s.wt)<=0)return s}return SH[0]};

// ---- réglages (sauvegardés) ----
let S={snd:1,vib:1,best:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('bb-save')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb-save',JSON.stringify(S))}catch(e){}};
const vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

// ---- sons synthétisés ----
let AC,MG;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='sine',v=.3,t0=0,f2){if(!AC||!S.snd)return;const t=AC.currentTime+t0,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+d+.02)}
const SC=[0,2,4,7,9,12,14,16,19];
const sfx={pick:()=>tone(520,.07,'triangle',.15,0,720),
 drop:()=>{tone(190,.15,'sine',.55,0,60);tone(1100,.03,'square',.05)},
 back:()=>tone(420,.16,'triangle',.15,0,200),
 clear:(n,s)=>{for(let k=0;k<3+n;k++)tone(440*2**(SC[Math.min(k+s,8)]/12),.3,'triangle',.18,k*.055);tone(120,.3,'sine',.4,0,50)},
 over:()=>[392,330,262,196].forEach((f,k)=>tone(f,.45,'sawtooth',.1,k*.2)),
 rec:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.3,'triangle',.2,k*.1))};

// ---- particules (canvas) ----
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],raf=0,lt=0;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,col,delay,n=5,pw=1){for(let k=0;k<n;k++){const a=Math.random()*6.28,v=(2+Math.random()*5)*pw;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:4+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,col,o:Math.random()<.4,t:-delay,life:700+Math.random()*500})}if(!raf)raf=requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(32,t-(lt||t));lt=t;cx.clearRect(0,0,innerWidth,innerHeight);
 P=P.filter(p=>{p.t+=dt;if(p.t<0)return 1;if(p.t>p.life)return 0;const k=dt/16;p.vy+=.22*k;p.x+=p.vx*k;p.y+=p.vy*k;p.r+=p.vr*k;cx.globalAlpha=1-p.t/p.life;cx.fillStyle=p.col;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);if(p.o){cx.beginPath();cx.arc(0,0,p.s/2,0,6.3);cx.fill()}else cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();return 1});
 if(P.length)raf=requestAnimationFrame(loop);else{raf=0;lt=0;cx.clearRect(0,0,innerWidth,innerHeight)}}

// ---- état du jeu ----
const board=$('#board'),fx=$('#fx'),slots=[...document.querySelectorAll('.slot')];
let G,pcs,sc,shown,streak,miss,over,prevBest,tw,rb,D=null,gh=[],hl=[];
const cells=[];
for(let i=0;i<64;i++){const e=document.createElement('div');e.className='c';board.appendChild(e);cells.push(e)}
const setCell=i=>{const e=cells[i],v=G[i];e.classList.toggle('f',!!v);if(v)e.style.setProperty('--c',COL[v-1])};
const pop=i=>{const e=cells[i];e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')};
const fits=(s,r,c)=>r>=0&&c>=0&&r+s.h<=N&&c+s.w<=N&&s.cells.every(([y,x])=>!G[(r+y)*N+c+x]);
const canAny=s=>{if(!s)return 0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(s,r,c))return 1;return 0};
function lines(a){const R=[],C=[];for(let r=0;r<N;r++){let ok=1;for(let c=0;c<N;c++)if(!a[r*N+c]){ok=0;break}if(ok)R.push(r)}
 for(let c=0;c<N;c++){let ok=1;for(let r=0;r<N;r++)if(!a[r*N+c]){ok=0;break}if(ok)C.push(c)}return[R,C]}

function mk(sl,s,i){sl.innerHTML='';const p=document.createElement('div');p.className='p';
 p.style.cssText=`width:calc(var(--cs)*${s.w});height:calc(var(--cs)*${s.h});margin:calc(var(--cs)*${-s.h/2}) 0 0 calc(var(--cs)*${-s.w/2});scale:.55;animation-delay:${i*80}ms`;
 p.innerHTML=s.cells.map(([y,x])=>`<i class="k" style="left:calc(var(--cs)*${x});top:calc(var(--cs)*${y});--c:${COL[s.c]}"></i>`).join('');sl.appendChild(p)}
function deal(){let t=0,p;do{p=[0,1,2].map(pick);t++}while(t<40&&!p.some(canAny));pcs=p;slots.forEach((sl,i)=>mk(sl,p[i],i))}
function refresh(delay){slots.forEach((sl,i)=>{const p=sl.firstChild;if(p)p.classList.toggle('dim',!canAny(pcs[i]))});
 if(pcs.every(p=>!canAny(p)))setTimeout(end,delay||500)}

// ---- score ----
const bump=()=>{const e=$('#score');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')};
function addScore(p){if(!p)return;sc+=p;
 if(prevBest>0&&sc>prevBest&&!rb){rb=1;const b=$('#best');b.classList.remove('rec');void b.offsetWidth;b.classList.add('rec');sfx.rec();vib([30,30,60]);burst(60,40,'#f7c331',0,30,1.6)}
 if(sc>S.best){S.best=sc;save()}$('#bv').textContent=S.best;
 cancelAnimationFrame(tw);const from=shown,to=sc,t0=performance.now();
 const f=t=>{const k=Math.min(1,(t-t0)/450);shown=Math.round(from+(to-from)*(1-(1-k)**3));$('#score').textContent=shown;if(k<1)tw=requestAnimationFrame(f)};tw=requestAnimationFrame(f);bump()}
function say(t,pts,sub){const m=$('#msg');m.innerHTML=`<b class="w">${t}</b><b class="pt">+${pts}</b>${sub?`<i>${sub}</i>`:''}`;m.className='';void m.offsetWidth;m.className='show'}

// ---- effets ----
function debris(k,col,d){const e=document.createElement('div');e.className='d';e.style.cssText=`left:${(k%N)*12.5}%;top:${(k/N|0)*12.5}%;--c:${col};animation-delay:${d}ms`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function beam(vert,a,col){const e=document.createElement('div');e.className='bm '+(vert?'l':'r');e.style.cssText=`${vert?'left':'top'}:${a*12.5}%;--c:${col}`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function bwfx(c){const e=$('#bw');e.classList.remove('shake','zoom');void e.offsetWidth;e.classList.add(c)}
const shake=()=>bwfx('shake');
function flash(c){const f=$('#flash');f.style.setProperty('--fc',c);f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function ring(x,y,c){const e=document.createElement('div');e.className='rg';e.style.cssText=`left:${x}%;top:${y}%;--c:${c}`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function saveRun(){if(!G||!pcs)return;S.run=over?null:{G,p:pcs.map(p=>p?p.id:-1),sc,streak,miss,pb:prevBest};save()}

// ---- placement ----
function place(i,s,[r,c]){const col=s.c+1;slots[i].innerHTML='';pcs[i]=null;
 s.cells.forEach(([y,x])=>{const k=(r+y)*N+c+x;G[k]=col;setCell(k);pop(k)});
 sfx.drop();vib(14);let gain=0;const placed=s.cells.length;
 const [R,C]=lines(G),n=R.length+C.length;
 if(n){streak++;miss=0;const set=new Set(),cy=r+s.h/2,cxx=c+s.w/2,br=board.getBoundingClientRect(),cs=br.width/N,colr=COL[s.c];
  R.forEach(a=>{for(let b=0;b<N;b++)set.add(a*N+b);beam(0,a,colr)});
  C.forEach(a=>{for(let b=0;b<N;b++)set.add(b*N+a);beam(1,a,colr)});
  set.forEach(k=>{const y=k/N|0,x=k%N,d=Math.hypot(y+.5-cy,x+.5-cxx)*32,cc=COL[G[k]-1];
   debris(k,cc,d);burst(br.left+(x+.5)*cs,br.top+(y+.5)*cs,cc,d+50,5);G[k]=0;setCell(k)});
  gain=10*n*n*Math.max(1,streak);let sub=streak>1?`COMBO ×${streak}`:'';
  if(G.every(v=>!v)){gain+=300;sub='Plateau vide ! +300';burst(innerWidth/2,br.top+br.width/2,'#f7c331',0,60,2.2)}
  say(WORDS[Math.min(4,n-1+(streak>2?1:0))],gain,sub);
  sfx.clear(n,streak);const big=n>=3||streak>=3,hot=Math.min(6,n+streak);vib([22,25,26,25,30+hot*14]);
  ring(cxx/N*100,cy/N*100,colr);if(n>=2||streak>=2)flash(colr);
  if(big){shake();burst(innerWidth/2,br.top+br.width/2,colr,80,24+hot*6,1.8)}else if(n>=2)bwfx('zoom');
  document.body.classList.toggle('fire',streak>=4);
 }else{miss++;if(miss>=3){streak=0;document.body.classList.remove('fire')}}
 addScore(placed+gain);
 if(pcs.every(p=>!p))deal();
 refresh(n?800:450);saveRun()}

// ---- glisser-déposer ----
function clearGhost(){gh.forEach(i=>cells[i].classList.remove('gh','h2'));hl.forEach(i=>cells[i].classList.remove('hl'));gh=[];hl=[]}
function preview(pos){const key=pos?pos.join():null;if(key===D.last)return;D.last=key;clearGhost();if(!pos)return;
 const s=D.s,[r,c]=pos,tmp=G.slice();
 s.cells.forEach(([y,x])=>{const i=(r+y)*N+c+x;tmp[i]=1;gh.push(i);cells[i].style.setProperty('--c',COL[s.c]);cells[i].classList.add('gh')});
 const [R,C]=lines(tmp),L=new Set();R.forEach(a=>{for(let b=0;b<N;b++)L.add(a*N+b)});C.forEach(a=>{for(let b=0;b<N;b++)L.add(b*N+a)});
 L.forEach(i=>{if(G[i]){cells[i].classList.add('hl');hl.push(i)}else cells[i].classList.add('h2')})}
function move(e){const {p,s,cs,br}=D,cxp=e.clientX,cyp=e.clientY-D.lift-s.h*cs/2;
 p.style.translate=`${cxp-D.x0}px ${cyp-D.y0}px`;
 const c=Math.round((cxp-s.w*cs/2-br.left)/cs),r=Math.round((cyp-s.h*cs/2-br.top)/cs);
 preview(fits(s,r,c)?[r,c]:null)}
slots.forEach((sl,i)=>{
 sl.addEventListener('pointerdown',e=>{const p=sl.firstChild;if(!p||D||over)return;e.preventDefault();audio();
  const br=board.getBoundingClientRect(),cs=br.width/N,r=p.getBoundingClientRect();
  D={p,i,s:pcs[i],cs,br,x0:r.left+r.width/2,y0:r.top+r.height/2,lift:e.pointerType==='touch'?cs*1.1:cs*.5,last:null,id:e.pointerId};
  try{sl.setPointerCapture(e.pointerId)}catch(_){}
  p.classList.remove('back');p.classList.add('drag','lift');p.style.scale=1;setTimeout(()=>p.classList.remove('lift'),140);
  move(e);sfx.pick();vib(8)});
 sl.addEventListener('pointermove',e=>{if(D&&D.i===i&&e.pointerId===D.id)move(e)});
 ['pointerup','pointercancel'].forEach(n=>sl.addEventListener(n,e=>{
  if(!D||D.i!==i||e.pointerId!==D.id)return;const d=D,pos=n==='pointerup'&&d.last?d.last.split(',').map(Number):null;D=null;clearGhost();
  d.p.classList.remove('drag','lift');
  if(pos)place(d.i,d.s,pos);
  else{d.p.classList.add('back');d.p.style.translate='0px 0px';d.p.style.scale=.55;setTimeout(()=>d.p.classList.remove('back'),300);sfx.back();vib(5)}}))});

// ---- fin / nouvelle partie ----
function end(){if(over||!pcs.every(p=>!canAny(p)))return;over=1;S.run=null;save();document.body.classList.remove('fire');
 board.classList.add('dead');sfx.over();vib([70,40,70,40,160]);
 const rec=sc>prevBest&&sc>0;$('#fs').textContent=sc;$('#fr').textContent=rec?'Nouveau record !':'Record : '+S.best;
 setTimeout(()=>{$('#over').classList.add('on');if(rec){sfx.rec();burst(innerWidth/2,innerHeight/3,'#f7c331',0,70,2.4)}},650)}
function newGame(res){const r=res&&S.run&&Array.isArray(S.run.G)&&S.run.G.length===64&&Array.isArray(S.run.p)&&S.run.p.some(i=>SH[i])?S.run:null;
 G=r?r.G.slice():Array(64).fill(0);sc=r?r.sc|0:0;shown=sc;streak=r?r.streak|0:0;miss=r?r.miss|0:0;over=0;prevBest=r?r.pb|0:S.best;rb=sc>prevBest?1:0;cancelAnimationFrame(tw);
 $('#score').textContent=sc;$('#bv').textContent=S.best;board.classList.remove('dead');fx.innerHTML='';document.body.classList.toggle('fire',streak>=4);
 cells.forEach((e,i)=>{setCell(i);e.style.setProperty('--dl',((i>>3)+(i&7))*35+'ms');e.classList.add('wv')});setTimeout(()=>cells.forEach(e=>e.classList.remove('wv')),1100);
 $('#over').classList.remove('on');$('#menu').classList.remove('on');
 if(r){pcs=r.p.map(i=>SH[i]||null);slots.forEach((sl,i)=>pcs[i]?mk(sl,pcs[i],i):sl.innerHTML='')}else{S.run=null;deal()}
 refresh();saveRun()}

function secure(){['contextmenu','copy','cut','paste','dragstart','selectstart','gesturestart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
 addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;if(e.key==='F12'||(m&&['u','s','p','a','c','x'].includes(k))||(m&&e.shiftKey&&['i','j','c','k'].includes(k))||(m&&e.altKey&&['i','j','u'].includes(k)))e.preventDefault()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AC&&AC.state==='running')AC.suspend();saveRun()}else if(AC)AC.resume()});
 addEventListener('pagehide',saveRun)}
function runIntro(){const it=$('#intro');$('#ir').textContent=S.best?'Record : '+S.best:'';
 [['BLOCK',0],['BLAST',5]].forEach(([w,o],ri)=>[...w].forEach((ch,i)=>{const t=document.createElement('b'),k=i+ri*5;t.className='tl';t.textContent=ch;t.style.cssText=`--c:${COL[(i+o)%8]};--d:${.3+k*.09}s;--i:${k}`;$('#r'+(ri+1)).appendChild(t)}));
 for(let i=0;i<18;i++){const b=document.createElement('i');b.className='fb';b.style.cssText=`left:${Math.random()*100}%;--c:${COL[i%8]};--s:${14+Math.random()*26}px;opacity:.45;animation-delay:${Math.random()*2.5}s;animation-duration:${2.5+Math.random()*2}s`;$('#ib').appendChild(b)}
 for(let i=0;i<10;i++){const b=document.createElement('i');b.className='fb';b.style.cssText=`left:${i*10+Math.random()*8}%;--c:${COL[i%8]};--s:${20+Math.random()*30}px;animation-delay:${-Math.random()*20}s;animation-duration:${16+Math.random()*14}s`;$('#amb').appendChild(b)}
 let done=0;const go=()=>{if(done)return;done=1;sfx.rec();vib(15);it.classList.add('out');newGame(1);setTimeout(()=>it.remove(),750)};
 it.addEventListener('pointerdown',()=>{audio();go()});setTimeout(go,3800)}

// ---- réglages ----
function ui(){$('#tSnd').textContent='Son : '+(S.snd?'activé':'désactivé');$('#tSnd').classList.toggle('off',!S.snd);
 $('#tVib').textContent='Vibrations : '+(S.vib?'activées':'désactivées');$('#tVib').classList.toggle('off',!S.vib);$('#badge').classList.toggle('off',!S.vib)}
$('#gear').onclick=()=>{audio();vib(8);$('#menu').classList.add('on')};
$('#bClose').onclick=()=>$('#menu').classList.remove('on');
$('#tSnd').onclick=()=>{audio();S.snd^=1;save();ui();sfx.pick()};
$('#tVib').onclick=()=>{S.vib^=1;save();ui();vib(30)};
$('#bNew').onclick=()=>{audio();newGame()};
$('#bAgain').onclick=()=>{audio();vib(10);newGame()};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
ui();$('#bv').textContent=S.best;secure();runIntro();
</script></body></html>
