<script>
const $=s=>document.querySelector(s),N=8;
const COL=['#f08a2a','#8a4fe0','#d03838','#3b5fe8','#f1c52e','#35b84a','#e8588c','#23b5d3'];
const WORDS=['Bien !','Super !','Excellent !','Incroyable !','Légendaire !'];
// [forme, poids, couleur]
const BASE=[["1",1,3],["11",3,3],["111",3,0],["1111",2,4],["11111",2,1],["11/11",3,4],["111/111/111",1,7],["11/10",3,2],["111/100/100",1,5],["111/010",2,6],["011/110",2,2],["110/011",2,5],["111/100",2,7],["111/001",2,0],["111/111",1,1]];
const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());
const SH=[];
BASE.forEach(([s,wt,c])=>{let m=s.split('/').map(r=>[...r].map(Number)),seen=new Set(),vs=[];
 for(let f=0;f<2;f++){for(let k=0;k<4;k++){const key=JSON.stringify(m);if(!seen.has(key)){seen.add(key);vs.push(m)}m=rot(m)}m=m.map(r=>[...r].reverse())}
 vs.forEach(m=>{const cells=[];m.forEach((r,y)=>r.forEach((v,x)=>v&&cells.push([y,x])));SH.push({cells,h:m.length,w:m[0].length,c,wt:wt/vs.length})})});
SH.forEach((s,i)=>s.id=i);
const TW=SH.reduce((a,s)=>a+s.wt,0);
let mode=0;const SIDX=[2,4,3,5],SH4=SH.filter(s=>s.cells.length==4);
const pick=()=>{if(mode){const a=SH4[Math.random()*SH4.length|0];return{...a,c:SIDX[Math.random()*4|0]}}let r=Math.random()*TW;for(const s of SH){if((r-=s.wt)<=0)return s}return SH[0]};

// ---- réglages (sauvegardés) ----
let S={snd:1,vib:1,best:0,bestS:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('bb-save')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb-save',JSON.stringify(S))}catch(e){}};
const vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

// ---- sons synthétisés ----
let AC,MG;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='sine',v=.3,t0=0,f2){if(!AC||!S.snd)return;const t=AC.currentTime+t0,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+d+.02)}
const SC=[0,2,4,7,9,12,14,16,19];
const sfx={pick:()=>tone(520,.07,'triangle',.15,0,720),
 drop:()=>{tone(190,.15,'sine',.55,0,60);tone(1100,.03,'square',.05)},
 back:()=>tone(420,.16,'triangle',.15,0,200),
 clear:(n,s)=>{for(let k=0;k<3+n;k++)tone(440*2**(SC[Math.min(k+s,8)]/12),.3,'triangle',.18,k*.055);tone(120,.3,'sine',.4,0,50)},
 over:()=>[392,330,262,196].forEach((f,k)=>tone(f,.45,'sawtooth',.1,k*.2)),
 rec:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.3,'triangle',.2,k*.1))};

// ---- particules (canvas) ----
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],raf=0,lt=0;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,col,delay,n=5,pw=1){if(P.length>450)P.splice(0,P.length-450);for(let k=0;k<n;k++){const a=Math.random()*6.28,v=(2+Math.random()*5)*pw;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:4+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,col,o:Math.random()<.4,t:-delay,life:700+Math.random()*500})}if(!raf)raf=requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(32,t-(lt||t));lt=t;cx.clearRect(0,0,innerWidth,innerHeight);
 P=P.filter(p=>{p.t+=dt;if(p.t<0)return 1;if(p.t>p.life)return 0;const k=dt/16;p.vy+=.22*k;p.x+=p.vx*k;p.y+=p.vy*k;p.r+=p.vr*k;cx.globalAlpha=1-p.t/p.life;cx.fillStyle=p.col;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);if(p.o){cx.beginPath();cx.arc(0,0,p.s/2,0,6.3);cx.fill()}else cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();return 1});
 if(P.length)raf=requestAnimationFrame(loop);else{raf=0;lt=0;cx.clearRect(0,0,innerWidth,innerHeight)}}

// ---- état du jeu ----
const board=$('#board'),fx=$('#fx'),slots=[...document.querySelectorAll('.slot')];
let G,pcs,sc,shown,streak,miss,over,prevBest,tw,rb,inflight=0,D=null,gh=[],hl=[];
const cells=[];
for(let i=0;i<64;i++){const e=document.createElement('div');e.className='c';board.appendChild(e);cells.push(e)}
const setCell=i=>{const e=cells[i],v=G[i];e.classList.toggle('f',!!v);if(v)e.style.setProperty('--c',COL[v-1])};
const pop=i=>{const e=cells[i];e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')};
const fits=(s,r,c)=>r>=0&&c>=0&&r+s.h<=N&&c+s.w<=N&&s.cells.every(([y,x])=>!G[(r+y)*N+c+x]);
const canAny=s=>{if(!s)return 0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(s,r,c))return 1;return 0};
function lines(a){const R=[],C=[];for(let r=0;r<N;r++){let ok=1;for(let c=0;c<N;c++)if(!a[r*N+c]){ok=0;break}if(ok)R.push(r)}
 for(let c=0;c<N;c++){let ok=1;for(let r=0;r<N;r++)if(!a[r*N+c]){ok=0;break}if(ok)C.push(c)}return[R,C]}

function mk(sl,s,i){sl.innerHTML='';const p=document.createElement('div');p.className='p';
 p.style.cssText=`width:calc(var(--cs)*${s.w});height:calc(var(--cs)*${s.h});margin:calc(var(--cs)*${-s.h/2}) 0 0 calc(var(--cs)*${-s.w/2});scale:.55;animation-delay:${i*80}ms`;
 p.innerHTML=s.cells.map(([y,x])=>`<i class="k" style="left:calc(var(--cs)*${x});top:calc(var(--cs)*${y});--c:${COL[s.c]}"></i>`).join('');sl.appendChild(p)}
function deal(){let t=0,p;do{p=[0,1,2].map(pick);t++}while(t<40&&!p.some(canAny));pcs=p;slots.forEach((sl,i)=>mk(sl,p[i],i))}
function refresh(delay){slots.forEach((sl,i)=>{const p=sl.firstChild;if(p)p.classList.toggle('dim',!canAny(pcs[i]))});
 if(pcs.every(p=>!canAny(p)))setTimeout(end,delay||500)}

// ---- score ----
const bump=()=>{const e=$('#score');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')};
function addScore(p,fly){if(!p)return;sc+=p;
 if(prevBest>0&&sc>prevBest&&!rb){rb=1;const b=$('#best');b.classList.remove('rec');void b.offsetWidth;b.classList.add('rec');sfx.rec();vib([30,30,60]);burst(60,40,'#f7c331',0,30,1.6)}
 const K=mode?'bestS':'best';if(sc>S[K]){S[K]=sc;save()}$('#bv').textContent=S[K];
 if(fly){flyPts(p,fly);return}tick()}
function tick(){const to=sc-inflight;theme(to);cancelAnimationFrame(tw);const from=shown,t0=performance.now();
 const f=t=>{const k=Math.min(1,(t-t0)/450);shown=Math.round(from+(to-from)*(1-(1-k)**3));$('#score').textContent=shown;if(k<1)tw=requestAnimationFrame(f)};tw=requestAnimationFrame(f);bump()}
function say(t,pts,sub){const m=$('#msg');m.innerHTML=`<b class="w">${t}</b>${sub?`<i>${sub}</i>`:''}`;m.className='';void m.offsetWidth;m.className='show'}

// ---- effets ----
function debris(k,col,d){const e=document.createElement('div');e.className='d';e.style.cssText=`left:${(k%N)*12.5}%;top:${(k/N|0)*12.5}%;--c:${col};animation-delay:${d}ms`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function beam(vert,a,col){const e=document.createElement('div');e.className='bm '+(vert?'l':'r');e.style.cssText=`${vert?'left':'top'}:${a*12.5}%;--c:${col}`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function bwfx(c){const e=$('#bw');e.classList.remove('shake','zoom');void e.offsetWidth;e.classList.add(c)}
const shake=()=>bwfx('shake');
function flash(c){const f=$('#flash');f.style.setProperty('--fc',c);f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function ring(x,y,c){const e=document.createElement('div');e.className='rg';e.style.cssText=`left:${x}%;top:${y}%;--c:${c}`;e.onanimationend=()=>e.remove();fx.appendChild(e)}
function saveRun(){if(mode||!G||!pcs)return;S.run=over?null:{G,p:pcs.map(p=>p?p.id:-1),sc,streak,miss,pb:prevBest};save()}

// ---- placement ----
function place(i,s,[r,c]){const col=s.c+1;slots[i].innerHTML='';pcs[i]=null;
 s.cells.forEach(([y,x])=>{const k=(r+y)*N+c+x;G[k]=col;setCell(k);pop(k)});
 sfx.drop();vib(14);let gain=0;const placed=s.cells.length;
 const [R,C]=lines(G),n=R.length+C.length;
 if(n){streak++;miss=0;const set=new Set(),cy=r+s.h/2,cxx=c+s.w/2,br=board.getBoundingClientRect(),cs=br.width/N,colr=COL[s.c];
  R.forEach(a=>{for(let b=0;b<N;b++)set.add(a*N+b);beam(0,a,colr)});
  C.forEach(a=>{for(let b=0;b<N;b++)set.add(b*N+a);beam(1,a,colr)});
  set.forEach(k=>{const y=k/N|0,x=k%N,d=Math.hypot(y+.5-cy,x+.5-cxx)*32,cc=COL[G[k]-1];
   debris(k,cc,d);burst(br.left+(x+.5)*cs,br.top+(y+.5)*cs,cc,d+50,5);G[k]=0;setCell(k)});
  gain=10*n*n*Math.max(1,streak);let sub=streak>1?`COMBO ×${streak}`:'';
  if(G.every(v=>!v)){gain+=300;sub='Plateau vide ! +300';burst(innerWidth/2,br.top+br.width/2,'#f7c331',0,60,2.2)}
  say(WORDS[Math.min(4,n-1+(streak>2?1:0))],gain,sub);
  sfx.clear(n,streak);const big=n>=3||streak>=3,hot=Math.min(6,n+streak);vib([22,25,26,25,30+hot*14]);
  ring(cxx/N*100,cy/N*100,colr);for(let k=1;k<Math.min(3,streak);k++)setTimeout(()=>ring(cxx/N*100,cy/N*100,COL[(s.c+k)%8]),k*130);
  if(streak>=3)for(let k=0;k<3;k++)burst(Math.random()*innerWidth,-5,COL[(s.c+k)%8],k*120,10,1.2);if(n>=2||streak>=2)flash(colr);
  if(big){shake();burst(innerWidth/2,br.top+br.width/2,colr,80,24+hot*6,1.8)}else if(n>=2)bwfx('zoom');
  document.body.classList.toggle('fire',streak>=4);
 }else{miss++;if(miss>=3){streak=0;document.body.classList.remove('fire')}}
 addScore(placed);if(gain)addScore(gain,fpos());
 if(pcs.every(p=>!p))deal();
 refresh(n?800:450);saveRun()}

// ---- glisser-déposer ----
function clearGhost(){gh.forEach(i=>cells[i].classList.remove('gh','h2'));hl.forEach(i=>cells[i].classList.remove('hl'));gh=[];hl=[]}
function preview(pos){const key=pos?pos.join():null;if(key===D.last)return;D.last=key;clearGhost();if(!pos)return;
 const s=D.s,[r,c]=pos,tmp=G.slice();
 s.cells.forEach(([y,x])=>{const i=(r+y)*N+c+x;tmp[i]=1;gh.push(i);cells[i].style.setProperty('--c',COL[s.c]);cells[i].classList.add('gh')});
 const [R,C]=lines(tmp),L=new Set();R.forEach(a=>{for(let b=0;b<N;b++)L.add(a*N+b)});C.forEach(a=>{for(let b=0;b<N;b++)L.add(b*N+a)});
 L.forEach(i=>{if(G[i]){cells[i].classList.add('hl');hl.push(i)}else cells[i].classList.add('h2')})}
function move(e){const {p,s,cs,br}=D,cxp=e.clientX,cyp=e.clientY-D.lift-s.h*cs/2;
 p.style.translate=`${cxp-D.x0}px ${cyp-D.y0}px`;
 const c=Math.round((cxp-s.w*cs/2-br.left)/cs),r=Math.round((cyp-s.h*cs/2-br.top)/cs);
 if(mode){D.fx=cxp-s.w*cs/2;D.fy=cyp-s.h*cs/2}else preview(fits(s,r,c)?[r,c]:null)}
slots.forEach((sl,i)=>{
 sl.addEventListener('pointerdown',e=>{const p=sl.firstChild;if(!p||D||over)return;e.preventDefault();audio();
  const br=$('#bw').getBoundingClientRect(),cs=br.width/N,r=p.getBoundingClientRect();
  D={p,i,s:pcs[i],cs,br,x0:r.left+r.width/2,y0:r.top+r.height/2,lift:e.pointerType==='touch'?cs*1.1:cs*.5,last:null,id:e.pointerId};
  try{sl.setPointerCapture(e.pointerId)}catch(_){}
  p.classList.remove('back');p.classList.add('drag','lift');p.style.scale=1;setTimeout(()=>p.classList.remove('lift'),140);
  move(e);sfx.pick();vib(8)});
 sl.addEventListener('pointermove',e=>{if(D&&D.i===i&&e.pointerId===D.id)move(e)});
 ['pointerup','pointercancel'].forEach(n=>sl.addEventListener(n,e=>{
  if(!D||D.i!==i||e.pointerId!==D.id)return;const d=D,pos=n==='pointerup'&&d.last?d.last.split(',').map(Number):null;D=null;clearGhost();
  d.p.classList.remove('drag','lift');
  if(mode&&n==='pointerup'&&d.fy!=null&&d.fy+d.s.h*d.cs/2>d.br.top-d.cs&&d.fy<d.br.bottom-d.cs)sandDrop(d);
  else if(pos)place(d.i,d.s,pos);
  else{d.p.classList.add('back');d.p.style.translate='0px 0px';d.p.style.scale=.55;setTimeout(()=>d.p.classList.remove('back'),300);sfx.back();vib(5)}}))});

// ---- fin / nouvelle partie ----
function end(){if(over||!pcs.every(p=>!canAny(p)))return;over=1;S.run=null;save();document.body.classList.remove('fire');
 board.classList.add('dead');sfx.over();vib([70,40,70,40,160]);
 const rec=sc>prevBest&&sc>0;$('#fs').textContent=sc;$('#fr').textContent=rec?'Nouveau record !':'Record : '+S.best;
 setTimeout(()=>{$('#over').classList.add('on');if(rec){sfx.rec();burst(innerWidth/2,innerHeight/3,'#f7c331',0,70,2.4)}},650)}
function newGame(res){const r=res&&S.run&&Array.isArray(S.run.G)&&S.run.G.length===64&&Array.isArray(S.run.p)&&S.run.p.some(i=>SH[i])?S.run:null;
 G=r?r.G.slice():Array(64).fill(0);sc=r?r.sc|0:0;shown=sc;streak=r?r.streak|0:0;miss=r?r.miss|0:0;over=0;prevBest=r?r.pb|0:S.best;rb=sc>prevBest?1:0;cancelAnimationFrame(tw);inflight=0;theme(sc,1);
 $('#score').textContent=sc;$('#bv').textContent=S.best;board.classList.remove('dead');fx.innerHTML='';document.body.classList.toggle('fire',streak>=4);
 cells.forEach((e,i)=>{setCell(i);e.style.setProperty('--dl',((i>>3)+(i&7))*35+'ms');e.classList.add('wv')});setTimeout(()=>cells.forEach(e=>e.classList.remove('wv')),1100);
 $('#over').classList.remove('on');$('#menu').classList.remove('on');
 if(r){pcs=r.p.map(i=>SH[i]||null);slots.forEach((sl,i)=>pcs[i]?mk(sl,pcs[i],i):sl.innerHTML='')}else{S.run=null;deal()}
 refresh();saveRun()}

function secure(){['contextmenu','copy','cut','paste','dragstart','selectstart','gesturestart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
 addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;if(e.key==='F12'||(m&&['u','s','p','a','c','x'].includes(k))||(m&&e.shiftKey&&['i','j','c','k'].includes(k))||(m&&e.altKey&&['i','j','u'].includes(k)))e.preventDefault()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AC&&AC.state==='running')AC.suspend();saveRun()}else if(AC)AC.resume()});
 addEventListener('pagehide',saveRun)}
function runIntro(){const it=$('#intro');$('#ir').textContent=S.best?'Record : '+S.best:'';
 [['BLOCK',0],['BLAST',5]].forEach(([w,o],ri)=>[...w].forEach((ch,i)=>{const t=document.createElement('b'),k=i+ri*5;t.className='tl';t.textContent=ch;t.style.cssText=`--c:${COL[(i+o)%8]};--d:${.3+k*.09}s;--i:${k}`;$('#r'+(ri+1)).appendChild(t)}));
 for(let i=0;i<12;i++){const b=document.createElement('i');b.className='fb';b.style.cssText=`left:${Math.random()*100}%;--c:${COL[i%8]};--s:${14+Math.random()*26}px;opacity:.45;animation-delay:${Math.random()*2.5}s;animation-duration:${2.5+Math.random()*2}s`;$('#ib').appendChild(b)}
 for(let i=0;i<10;i++){const b=document.createElement('i');b.className='fb';b.style.cssText=`left:${i*10+Math.random()*8}%;--c:${COL[i%8]};--s:${20+Math.random()*30}px;animation-delay:${-Math.random()*20}s;animation-duration:${16+Math.random()*14}s`;$('#amb').appendChild(b)}
 let done=0;const go=()=>{if(done)return;done=1;sfx.rec();vib(15);it.classList.add('out');showHome();setTimeout(()=>it.remove(),750)};
 it.addEventListener('pointerdown',()=>{audio();go()});setTimeout(go,3800)}

// ---- réglages ----

function sstep(){let mv=0;const alt=sset^=1;
 for(let y=H-2;y>=0;y--)for(let k=0;k<W;k++){const x=alt?k:W-1-k,i=y*W+x,v=SG[i];if(!v)continue;const b=i+W;
  if(!SG[b]){SG[b]=v;SG[i]=0;mv++}else{const l=x>0&&!SG[b-1],r=x<W-1&&!SG[b+1];
   if(l&&r){SG[Math.random()<.5?b-1:b+1]=v;SG[i]=0;mv++}else if(l){SG[b-1]=v;SG[i]=0;mv++}else if(r){SG[b+1]=v;SG[i]=0;mv++}}}
 return mv}
function bstep(){bodies=bodies.filter(b=>{b.v=Math.min(b.v+.25,3.5);const ny=b.y+b.v,iy=Math.floor(ny);let hit=0;
 for(const[cx,cy]of b.g){const gy=iy+cy;if(gy>=H||(gy>=0&&SG[gy*W+b.x+cx])){hit=1;break}}
 if(!hit){b.y=ny;return 1}
 let y=Math.floor(b.y);for(;;){let ok=1;for(const[cx,cy]of b.g){const gy=y+1+cy;if(gy>=H||(gy>=0&&SG[gy*W+b.x+cx])){ok=0;break}}if(!ok)break;y++}
 for(const[cx,cy]of b.g){const gy=y+cy;if(gy<0||gy>=H)continue;let i=gy*W+b.x+cx;while(i>=W&&SG[i])i-=W;if(!SG[i])SG[i]=b.c|(Math.random()*4<<3)}

function sdraw(){const d=simg.data;for(let i=0,n=W*H;i<n;i++){const v=SG[i],o=i<<2;if(!v){d[o+3]=0;continue}const c=SCOL[v&7],k=.92+(v>>3)*.055;d[o]=c[0]*k;d[o+1]=c[1]*k;d[o+2]=c[2]*k;d[o+3]=255}
 sox.putImageData(simg,0,0);const cw=scv.width,ch=scv.height;sctx.clearRect(0,0,cw,ch);sctx.drawImage(off,0,0,cw,ch);
 const cp=cw/8,m=cp*.09;bodies.forEach(b=>{const X=b.x/W*cw,Y=b.y/H*ch;b.s.cells.forEach(([y,x])=>{const px=X+x*cp,py=Y+y*cp;sctx.fillStyle=COL[b.s.c];sctx.fillRect(px,py,cp,cp);sctx.fillStyle='rgba(255,255,255,.3)';sctx.fillRect(px,py,cp,m);sctx.fillRect(px,py,m,cp);sctx.fillStyle='rgba(0,0,0,.3)';sctx.fillRect(px,py+cp-m,cp,m);sctx.fillRect(px+cp-m,py,m,cp)})})}
function sclear(){const rem=[];
 for(let c=1;c<5;c++){const seen=new Uint8Array(W*H);
  for(let y=0;y<H;y++){const s=y*W;if((SG[s]&7)!==c||seen[s])continue;seen[s]=1;const st=[s],comp=[];let reach=0;
   while(st.length){const i=st.pop(),x=i%W;comp.push(i);if(x===W-1)reach=1;for(const j of[i-W,i+W,x?i-1:-1,x<W-1?i+1:-1])if(j>=0&&j<W*H&&!seen[j]&&(SG[j]&7)===c){seen[j]=1;st.push(j)}}
   if(reach)for(const i of comp)rem.push(i)}}
 if(!rem.length)return 0;
 const r=$('#bw').getBoundingClientRect();
 rem.forEach((i,k)=>{if(k%14===0){const c=SCOL[SG[i]&7];burst(r.left+(i%W+.5)/W*r.width,r.top+((i/W|0)+.5)/H*r.height,`rgb(${c})`,0,1,1.4)}SG[i]=7|(SG[i]&24)});
 fl=rem;freeze=9;sstreak++;const n=Math.ceil(rem.length/256),pts=Math.round(rem.length/6)*Math.max(1,sstreak);
 addScore(pts,fpos());say(WORDS[Math.min(4,n-1+(sstreak>2?1:0))],pts,sstreak>1?`COMBO ×${sstreak}`:'');sfx.clear(n,sstreak);vib([22,25,26,25,40+n*12]);flash('#fff');if(n>=2||sstreak>=3)shake();return 1}
